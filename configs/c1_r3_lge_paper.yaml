_base_: _base_.yaml

model:
  name: c1_r3_lge_paper
  backbone: {name: mobilevit, variant: xs, pretrained: true}
  neck:
    name: fgfpn
    fuse_conv: pairwise_cross
    out_conv: false
    topdown: true
    lge: true
    lge_k: 2
    lge_s: 1
    lge_kernel_size: 7
    lge_strides: [4, 8]
  levels: [4, 8, 16, 32]
  num_classes: 4

data:
  root: /root/autodl-tmp/data/urpc_coco
  ann_train: /root/autodl-tmp/data/annotations/train_clean.json
  ann_test: /root/autodl-tmp/data/annotations/test_clean.json
  img_train: /root/autodl-tmp/data/urpc_coco/train2018/image
  img_test: /root/autodl-tmp/data/urpc_coco/test2018/image
  num_classes: 4
  input_size: [416, 416]
  normalize_mean: [0.0, 0.0, 0.0]
  normalize_std: [1.0, 1.0, 1.0]

optimizer:
  type: SGD
  lr: 0.05
  momentum: 0.9
  weight_decay: 0.0001
  backbone_lr_factor: 0.5

schedule:
  epochs: 24
  lr_decay: [16, 22]
  lr_decay_factor: 0.1
  warmup_iters: 2500
  warmup_ratio: 0.00066667

train:
  batch_size: 8
  num_workers: 12
  grad_clip: 35
  amp: bf16
  log_interval: 50
  seed: 0

postprocess:
  nms_pre: 1000
  score_thr: 0.05
  nms_iou: 0.5
  max_per_img: 100
