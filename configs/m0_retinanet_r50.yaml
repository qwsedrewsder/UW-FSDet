_base_: _base_.yaml

model:
  name: m0_retinanet_r50
  backbone: {name: resnet50, pretrained: true}
  neck: {name: none}
  levels: [8, 16, 32, 64, 128]   # P3..P7 (RetinaNet original)
  num_classes: 4

# M0 uses ImageNet normalization for torchvision ResNet-50.
data:
  root: /root/autodl-tmp/data/urpc_coco
  ann_train: /root/autodl-tmp/data/annotations/train_clean.json
  ann_test: /root/autodl-tmp/data/annotations/test_clean.json
  img_train: /root/autodl-tmp/data/urpc_coco/train2018/image
  img_test: /root/autodl-tmp/data/urpc_coco/test2018/image
  num_classes: 4
  input_size: [416, 416]
  normalize_mean: [0.485, 0.456, 0.406]
  normalize_std: [0.229, 0.224, 0.225]

# M0 uses the standard MMDetection RetinaNet warmup of 500 iterations, about 1.4 epochs at batch size 8.
# The paper specifies 2500 iterations with an unknown batch size; M0 follows the MMDetection default.
schedule:
  warmup_iters: 500
