# D92 = E2 (MobileViT-XS + PAN + YOLOv8-style head) + PPM (residual preprocessing)
# Reuse the validated D9v2 setup: zero-initialized PPM residual, E2 initialization, and three-stage training
#
#   Stage 1 (0-4 epochs):    train PPM only
#   Stage 2 (4-20 epochs):   train the detector only, fine-tuning from E2 weights
#   Stage 3 (20-36 epochs):  joint training
_base_: _base_.yaml

model:
  name: d92_e2_ppm
  backbone: {name: mobilevit, variant: xs, pretrained: true}
  neck:
    name: pan
    out_channels: 256
    pan_depth: 3
  head:
    name: yolo
  ppm:
    to_rgb: true
    residual: true
    residual_scale: 0.5
    detach_stage0: true
    uie_mid: 16
    sr_mid: 16
    uie_tv_w: 0.1
    uie_perc_w: 0.02
    sr_mse_w: 1.0
    use_perc: true
  pretrained_ckpt: /root/autodl-tmp/work_dirs/e2_mvit_pan_yolo_seed0/ckpt/final.pth
  levels: [8, 16, 32]
  num_classes: 4

data:
  root: /root/autodl-tmp/data/urpc_coco
  ann_train: /root/autodl-tmp/data/annotations/train_clean.json
  ann_test: /root/autodl-tmp/data/annotations/test_clean.json
  img_train: /root/autodl-tmp/data/urpc_coco/train2018/image
  img_test: /root/autodl-tmp/data/urpc_coco/test2018/image
  num_classes: 4
  input_size: [416, 416]
  normalize_mean: [0.0, 0.0, 0.0]
  normalize_std: [1.0, 1.0, 1.0]

optimizer:
  type: SGD
  lr: 0.05
  momentum: 0.9
  weight_decay: 0.0001
  backbone_lr_factor: 0.5

schedule:
  epochs: 24
  lr_decay: [16, 22]
  lr_decay_factor: 0.1
  warmup_iters: 500
  warmup_ratio: 0.00066667

train:
  batch_size: 8
  num_workers: 12
  grad_clip: 35
  amp: bf16
  log_interval: 50
  seed: 0
  ppm_stages: [4, 16]
  eval_from_epoch: 1

postprocess:
  nms_pre: 1000
  score_thr: 0.05
  nms_iou: 0.5
  max_per_img: 100
